[build-system]
requires = ["scikit-build-core >= 0.10", "pybind11 >= 2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "redzed-tda"
version = "0.1.1"
description = "Fast Vietoris-Rips persistent homology"
readme = "README.md"
requires-python = ">= 3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Kapulkin", email = "krzysztof.r.kapulkin@vanderbilt.edu" },
    { name = "Nathan Kershaw", email = "nkershaw@uwo.ca" },
]
maintainers = [
    { name = "Nathan Kershaw", email = "nkershaw@uwo.ca" },
]
keywords = ["topology", "persistent homology", "vietoris-rips", "tda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy >= 1.21"]

[project.optional-dependencies]
test = ["pytest >= 7"]

[project.urls]
Homepage = "https://github.com/nkershaw01/RedZeD"
Source = "https://github.com/nkershaw01/RedZeD/tree/main/python"

[tool.scikit-build]
wheel.packages = ["src/redzed_tda"]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.sdist]
exclude = ["build/", "dist/", "wheelhouse/", ".venv/",
           "*.pyd", "*.so", "*.whl", "*.tar.gz", "PACKAGING_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.cibuildwheel]
skip = ["*-musllinux*", "cp*t-*", "*-win32"]
test-extras = ["test"]
# {package} is the package directory; {project} is wherever cibuildwheel was invoked
test-command = "pytest {package}/tests"
build-verbosity = 1
